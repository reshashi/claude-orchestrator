gates:
  qa-guardian:
    enabled: true
    blocking: true
    trigger: always
  verify-app:
    enabled: true
    blocking: true
    trigger: always
  devops-engineer:
    enabled: true
    blocking: false
    trigger:
      files_match:
        - ".github/**"
        - "Dockerfile*"
        - "docker-compose*"
        - "vercel.json"
        - "supabase/**"
        - ".env*"
  code-simplifier:
    enabled: true
    blocking: false
    trigger:
      min_lines_changed: 50
  qa-browser:
    enabled: true
    blocking: false
    trigger:
      files_match:
        - "app/**/*.tsx"
        - "app/**/*.css"
settings:
  ci_poll_interval_seconds: 30
  ci_timeout_minutes: 30
  merge_method: squash
  delete_branch_on_merge: true
  auto_merge: true
